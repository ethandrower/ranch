<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ranch — Per-hand kanban + decision packet prototype</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --panel-2: #1c2030;
    --panel-3: #232838;
    --border: #262b3c;
    --border-2: #313753;
    --text: #e6e9ef;
    --text-dim: #8a93a6;
    --text-faint: #5a6378;
    --accent: #6aa2ff;
    --warn: #f5a623;
    --warn-soft: #3a2e1e;
    --ok: #4eb960;
    --ok-soft: #1e3a2e;
    --bad: #d85a5a;
    --bad-soft: #3a1e1e;
    --magenta: #b85cb8;
    --cyan: #5cd0d0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }
  /* ─── Top bar ─── */
  .topbar {
    display: flex; align-items: stretch;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    user-select: none;
    height: 44px;
  }
  .brand {
    padding: 0 18px;
    display: flex; align-items: center;
    font-weight: 600; font-size: 14px;
    color: var(--text);
    letter-spacing: -0.01em;
    border-right: 1px solid var(--border);
  }
  .brand .brand-dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: 8px;
    box-shadow: 0 0 8px var(--accent);
  }
  .tabs { display: flex; align-items: stretch; flex: 1; }
  .tab {
    padding: 0 16px;
    display: flex; align-items: center; gap: 8px;
    color: var(--text-dim);
    cursor: pointer;
    border-right: 1px solid var(--border);
    font-size: 13px;
  }
  .tab:hover { background: var(--panel-2); color: var(--text); }
  .tab.active {
    background: var(--bg);
    color: var(--text);
    box-shadow: inset 0 -2px 0 var(--accent);
  }
  .tab .badge {
    background: var(--warn);
    color: #1c1306;
    font-size: 10.5px; font-weight: 700;
    padding: 1px 6px; border-radius: 999px;
    min-width: 18px; text-align: center;
    line-height: 14px;
  }
  .tab .badge.zero {
    background: transparent;
    color: var(--text-faint);
    border: 1px solid var(--border-2);
    font-weight: 500;
  }
  .tab .hand-status {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ok);
  }
  .tab .hand-status.idle { background: var(--text-faint); }
  .topbar-right {
    padding: 0 16px;
    display: flex; align-items: center; gap: 16px;
    color: var(--text-dim);
    font-size: 12px;
  }
  .topbar-right .meta { color: var(--text-faint); }

  /* ─── Routines comparison strip (shows BOTH concepts) ─── */
  .routines-bar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 18px 12px;
  }
  .routines-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .routines-header .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    font-weight: 600;
  }
  .routines-toggle { display: flex; gap: 2px; }
  .routines-toggle button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 12px;
    font-size: 11.5px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .routines-toggle button:first-child { border-radius: 4px 0 0 4px; }
  .routines-toggle button:last-child { border-radius: 0 4px 4px 0; }
  .routines-toggle button.active {
    background: var(--accent);
    color: #0a0f1c;
    border-color: var(--accent);
    font-weight: 600;
  }

  /* Routines: STRIP CONCEPT */
  .routines-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .routine {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .routine .icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--panel-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .routine .info { flex: 1; }
  .routine .name {
    font-size: 11.5px;
    color: var(--text);
    font-weight: 500;
  }
  .routine .status {
    font-size: 10.5px;
    color: var(--text-dim);
    font-family: "SF Mono", monospace;
    margin-top: 1px;
  }
  .routine .status.ok { color: var(--ok); }
  .routine .status.warn { color: var(--warn); }
  .routine .pulse {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ok);
    animation: pulse 2s ease-out infinite;
  }
  .routine.idle .pulse { background: var(--text-faint); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(78, 185, 96, 0.5); }
    70% { box-shadow: 0 0 0 6px rgba(78, 185, 96, 0); }
    100% { box-shadow: 0 0 0 0 rgba(78, 185, 96, 0); }
  }

  /* Routines: EVENT CONCEPT */
  .routines-event {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 16px;
    text-align: center;
    color: var(--text-faint);
    font-size: 12px;
    min-height: 56px;
    display: flex; align-items: center; justify-content: center;
  }
  .routines-event.has-event {
    background: var(--warn-soft);
    border-color: var(--warn);
    color: var(--text);
    text-align: left;
    justify-content: flex-start;
    gap: 12px;
  }
  .routines-event .event-icon {
    color: var(--warn);
    font-size: 18px;
  }
  .routines-event .event-body strong { color: var(--warn); }
  .routines-event .event-ago {
    color: var(--text-faint);
    font-size: 11px;
    margin-left: auto;
  }
  .routines-event .pretend {
    font-style: italic;
    color: var(--text-faint);
    font-size: 11.5px;
    margin-top: 4px;
  }

  .hint-row {
    color: var(--text-faint);
    font-size: 11px;
    margin-top: 8px;
    font-style: italic;
  }

  /* ─── Kanban ─── */
  .kanban-wrap {
    overflow-x: auto;
    padding: 14px 16px 28px;
    height: calc(100vh - 44px - 124px);  /* topbar + routines */
  }
  .kanban {
    display: grid;
    grid-template-columns: repeat(10, minmax(150px, 1fr));
    gap: 10px;
    min-width: 1500px;
    align-items: flex-start;
  }
  .col {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex; flex-direction: column;
    min-height: 100px;
  }
  .col-header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel-2);
    border-radius: 6px 6px 0 0;
  }
  .col-title {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    font-weight: 600;
  }
  .col-counts { display: flex; gap: 6px; align-items: center; }
  .col-count {
    background: var(--panel-3);
    color: var(--text-dim);
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 3px;
  }
  .col-attention {
    background: var(--warn);
    color: #1c1306;
    font-size: 10.5px; font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
  }
  .col-body {
    padding: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .col.terminal {
    background: rgba(78,185,96,0.05);
    border-color: rgba(78,185,96,0.3);
  }
  .col.terminal .col-title { color: var(--ok); }
  .col.attention {
    box-shadow: 0 0 0 1px var(--warn);
  }

  /* Cards */
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 9px;
    cursor: pointer;
    transition: border-color 0.12s, transform 0.08s;
    position: relative;
  }
  .card:hover { border-color: var(--border-2); transform: translateY(-1px); }
  .card.attention {
    border-left: 3px solid var(--warn);
    padding-left: 8px;
  }
  .card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .card-key {
    font-family: "SF Mono", Menlo, monospace;
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
  .card-key.adhoc { color: var(--magenta); }
  .card-summary {
    color: var(--text);
    font-size: 12px;
    margin-top: 3px;
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .card-hint {
    color: var(--text-faint);
    font-size: 10.5px;
    margin-top: 4px;
    font-family: "SF Mono", monospace;
  }
  .card .attention-glyph {
    color: var(--warn);
    font-size: 12px;
  }
  .empty-col {
    color: var(--text-faint);
    text-align: center;
    padding: 18px 8px;
    font-size: 11px;
    border: 1px dashed var(--border);
    border-radius: 4px;
    margin: 6px;
  }

  /* ─── Side panel (decision packet) ─── */
  .side-panel {
    position: fixed;
    top: 44px; right: 0; bottom: 0;
    width: 540px;
    max-width: 50vw;
    background: var(--panel);
    border-left: 1px solid var(--border-2);
    box-shadow: -8px 0 24px rgba(0,0,0,0.4);
    transform: translateX(100%);
    transition: transform 0.25s ease;
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .side-panel.open { transform: translateX(0); }
  .panel-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel-2);
  }
  .panel-header .key {
    font-family: "SF Mono", monospace;
    color: var(--accent);
    font-weight: 600;
    font-size: 13px;
    margin-right: 8px;
  }
  .panel-header .summary {
    color: var(--text);
    font-size: 13.5px;
    font-weight: 500;
  }
  .panel-header .close-btn {
    background: transparent;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    font-size: 16px;
    padding: 4px 8px;
  }
  .panel-header .close-btn:hover { color: var(--text); }
  .panel-body {
    padding: 18px 20px 32px;
    flex: 1;
  }

  /* Sections */
  .section {
    margin-bottom: 24px;
  }
  .section-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-faint);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .section-num {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: var(--panel-3);
    color: var(--text-dim);
    font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
  }
  .section.goal .section-num { background: var(--accent); color: #0a0f1c; }
  .section.now .section-num,
  .section.done .section-num { background: var(--cyan); color: #0a0f1c; }
  .section.decide .section-num { background: var(--warn); color: #1c1306; }
  .section.watching .section-num { background: var(--text-faint); color: #0a0f1c; }

  .section-content { color: var(--text); font-size: 13px; }
  .section.goal .section-content { line-height: 1.55; }

  .done-list {
    list-style: none; padding: 0; margin: 0;
    font-size: 12.5px;
  }
  .done-list li {
    display: flex; gap: 9px; align-items: flex-start;
    padding: 3px 0;
  }
  .done-list .check { color: var(--ok); font-family: "SF Mono", monospace; min-width: 14px; }
  .done-list .text { color: var(--text-dim); }
  .done-list .text.recent { color: var(--text); }

  .now-block {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 11px 12px;
  }
  .now-line {
    color: var(--text);
    font-size: 12.5px;
  }
  .now-meta {
    color: var(--text-faint);
    font-size: 11px;
    margin-top: 5px;
    font-family: "SF Mono", monospace;
  }

  .decide-prompt {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 12px;
    line-height: 1.55;
  }
  .decide-prompt strong { color: var(--text); }
  .diff-list {
    font-family: "SF Mono", Menlo, monospace;
    font-size: 11.5px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 10px;
    margin-bottom: 12px;
  }
  .diff-list .file {
    display: flex; justify-content: space-between;
    padding: 1px 0;
  }
  .diff-list .ins { color: var(--ok); }
  .diff-list .del { color: var(--bad); }

  .actions {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-top: 14px;
  }
  .btn {
    background: var(--panel-2);
    border: 1px solid var(--border-2);
    color: var(--text);
    padding: 8px 14px;
    font-size: 12.5px;
    font-weight: 500;
    border-radius: 5px;
    cursor: pointer;
  }
  .btn:hover { background: var(--border-2); }
  .btn-primary {
    background: var(--accent);
    color: #0a0f1c;
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn-primary:hover { background: #87b6ff; }
  .btn-danger {
    color: var(--bad);
    border-color: var(--bad-soft);
  }
  .btn-danger:hover { background: var(--bad-soft); }
  .btn-takeover {
    background: transparent;
    color: var(--cyan);
    border-color: var(--cyan);
  }

  .watching-content {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 14px;
  }
  .watching-content .next-check {
    color: var(--text-dim);
    font-size: 12px;
  }
  .watching-content .next-check strong { color: var(--text); }
  .watching-content .progress-track {
    margin-top: 10px;
    background: var(--panel-3);
    height: 4px;
    border-radius: 2px;
    overflow: hidden;
  }
  .watching-content .progress-fill {
    background: var(--cyan);
    height: 100%;
    transition: width 0.4s ease;
  }
  .watching-content .eta {
    color: var(--text-faint);
    font-size: 11px;
    margin-top: 8px;
    font-family: "SF Mono", monospace;
  }

  .recommendation {
    background: rgba(106,162,255,0.10);
    border: 1px solid var(--accent);
    border-radius: 5px;
    padding: 10px 12px;
    margin-bottom: 12px;
    color: var(--text);
    font-size: 12px;
  }
  .recommendation.no-deploy {
    background: var(--panel-3);
    border-color: var(--border-2);
    color: var(--text-dim);
  }
  .recommendation .rec-label {
    font-weight: 700;
    color: var(--accent);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: block;
    margin-bottom: 3px;
  }
  .recommendation.no-deploy .rec-label { color: var(--text-faint); }

  /* Footer hint */
  .footer-hint {
    text-align: center;
    padding: 6px;
    color: var(--text-faint);
    font-size: 10.5px;
    font-style: italic;
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="brand-dot"></span>Ranch</div>
    <div class="tabs" id="tabs"></div>
    <div class="topbar-right">
      <span class="meta" id="clock"></span>
      <span class="meta">●  4 hands running</span>
    </div>
  </div>

  <!-- Routines area: showing BOTH concepts so we can pick -->
  <div class="routines-bar">
    <div class="routines-header">
      <div class="label">⟳ Hand routines · <span id="routinesHandName">max</span></div>
      <div class="routines-toggle">
        <button id="rtStrip" class="active" onclick="setRoutines('strip')">Concept A — Always-visible strip</button>
        <button id="rtEvent" onclick="setRoutines('event')">Concept B — Only when events fire</button>
      </div>
    </div>
    <div id="routinesContent"></div>
  </div>

  <div class="kanban-wrap">
    <div class="kanban" id="kanban"></div>
  </div>

  <div class="side-panel" id="sidePanel">
    <div class="panel-header">
      <div>
        <span class="key" id="panelKey">—</span>
        <span class="summary" id="panelSummary">—</span>
      </div>
      <button class="close-btn" onclick="closePanel()">✕</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </div>

  <div class="footer-hint" id="footerHint">
    Prototype v3 · click any card → side panel opens with Goal / Done / Now / Decide (or Watching for).
  </div>

<script>
// ───────────────────────────────────────────────────────────────────
// Ten canonical pipeline stages, in display order left → right.
// ───────────────────────────────────────────────────────────────────
const STAGES = [
  {key: "triage",    label: "Triage"},
  {key: "scope",     label: "Scope"},
  {key: "plan",      label: "Plan"},
  {key: "code",      label: "Code"},
  {key: "verify",    label: "Verify"},
  {key: "pre_push",  label: "Pre-push"},
  {key: "deploy",    label: "Deploy"},
  {key: "pr_open",   label: "PR open"},
  {key: "review",    label: "Review"},
  {key: "merge",     label: "Merge", terminal: true},
];

// ───────────────────────────────────────────────────────────────────
// Mock data shaped roughly the way the live ranch.db would expose it.
// ───────────────────────────────────────────────────────────────────
const HANDS = {

    routines: {

      pr_comments:  {last_poll_seconds_ago: 47, next_in: 73, status: "ok", watching_count: 2},
      ci_status:    {last_poll_seconds_ago: 23, next_in: 37, status: "ok", watching_count: 2},
      self_review:  {state: "idle", note: "active during agent QA phases only"},
    },
    events: [
      {kind: "ci_flip", ticket: "ECD-1762", from: "running", to: "failed", ago: "30s"},
    ],
    tickets: [
      {
        key: "ECD-2105", stage: "triage",
        summary: "Improve search hit caching",

        goal: "Reduce repeat search-hit DB hits on the lit-review index page; we're seeing 8+ identical queries per page load.",
      },
      {
        key: "ECD-2099", stage: "triage",
        summary: "Add pagination headers to /api/articles",
        hint: "score 62",
        goal: "Expose Link headers so external consumers can paginate without parsing the body.",
      },
      {
        key: "ECD-2078", stage: "triage",
        summary: "Migrate old search endpoint to v3",
        hint: "score 45",
        goal: "Sunset /api/search/v1 in favor of v3 which has consistent return shapes.",
      },
      {
        key: "ECD-2073", stage: "plan",
        summary: "Performance deploy — Celery worker scaling",
        hint: "parked · 12m",
        attention: true,
        checkpoint: "plan_ready",
        goal: "Improve throughput on hot Celery queues by isolating scrape-dispatch tasks to a dedicated worker. Should cut p95 dispatch latency by 40% per prod metrics.",
        done: [
          "Read epic + sister tickets",
          "Pulled prod metrics for queue depth distribution",

      {

        attention: false,

        done: [
          "Inspect existing migration hook",
          "Failing test for audit writer",
        ],
        now: {
          line: "Implementing AuditLogWriter. Just wrote the failing test; about to implement the writer.",
          meta: "in state 1m 30s · 11.2k tokens · last record_state 1m ago",
        },
        next_checkpoint: "tests_green",
        next_eta_seconds: 240,
        next_progress_pct: 38,
      },
      {
        key: "ECD-2087", stage: "pre_push",
        summary: "Restore post-scrape dedup dispatch",
        hint: "parked · 2m · deploy?",
        attention: true,
        checkpoint: "pre_push",
        goal: "Restore the post-scrape dedup step that was dropped in the 0317 migration. Fix the silent data loss it caused.",
        done: [
          "Read scrape dispatch flow",
          "Added post-dedup dispatch step in lit_reviews/dedup/dispatch.py",
          "Wired onComplete callback in tasks.py",
          "Pytest 4/4 + scraper integration green",
        ],
        now: {
          line: "Acceptance 4/4 green. Diff is +88/-12 across 3 files. Ready for operator review.",
          meta: "in state 2m 14s · 18.4k tokens · 6 commits ahead of develop",

let current = "max";
let routinesMode = "strip";
let selectedCard = null;

// ─── Tabs ─────────────────────────────────────────────────────────
function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  Object.entries(HANDS).forEach(([k, h]) => {
    const all = h.tickets.concat(h.adhoc || []);
    const needsYouCount = all.filter(t => t.attention).length;
    const tab = document.createElement("div");
    tab.className = "tab" + (k === current ? " active" : "");
    tab.innerHTML = `
      <span class="hand-status ${h.status === 'idle' ? 'idle' : ''}"></span>
      <span class="hand-name">${h.label}</span>
      <span class="badge ${needsYouCount === 0 ? 'zero' : ''}">${needsYouCount === 0 ? '0' : needsYouCount}</span>
    `;
    tab.onclick = () => {
      current = k; closePanel();
      render();
    };
    el.appendChild(tab);
  });
}

// ─── Routines area ────────────────────────────────────────────────
function setRoutines(mode) {
  routinesMode = mode;
  document.getElementById("rtStrip").classList.toggle("active", mode === "strip");
  document.getElementById("rtEvent").classList.toggle("active", mode === "event");
  renderRoutines();
}

function renderRoutines() {
  document.getElementById("routinesHandName").textContent = current;
  const wrap = document.getElementById("routinesContent");
  const hand = HANDS[current];

  if (routinesMode === "strip") {
    wrap.innerHTML = `
      <div class="routines-strip">
        ${renderRoutine("⟳", "Jira triage", hand.routines.jira_triage)}
        ${renderRoutine("💬", "PR comments", hand.routines.pr_comments)}
        ${renderRoutine("✓", "CI status", hand.routines.ci_status)}
        ${renderRoutine("👁", "Self-review", hand.routines.self_review)}
      </div>
      <div class="hint-row">
        Concept A: persistent visibility of background routines. Tradeoff — eats screen
        space even when nothing's happening; operator may tune it out (banner blindness).
      </div>
    `;
  } else {
    const events = hand.events || [];
    if (events.length === 0) {
      wrap.innerHTML = `
        <div class="routines-event">
          No recent routine events. The bar surfaces only when something fires.
        </div>
        <div class="hint-row">
          Concept B: silent unless an event fires (CI flipped, comment arrived, etc.).
          Tradeoff — no proof of life when quiet; operator may wonder "is the hand even running?"
          <div class="pretend">↓ Pretend this just happened ↓</div>
        </div>
        <div class="routines-event has-event" style="margin-top: 8px">
          <span class="event-icon">⚡</span>
          <div class="event-body">
            <div><strong>CI failed</strong> on PR #1834 (ECD-1762)</div>
            <div style="color: var(--text-dim); font-size: 11.5px; margin-top: 2px;">build went <span style="color: var(--ok)">running</span> → <span style="color: var(--bad)">failed</span></div>
          </div>
          <div class="event-ago">30s ago</div>
        </div>
      `;
    } else {
      const banners = events.map(ev => `
        <div class="routines-event has-event" style="margin-bottom: 6px">
          <span class="event-icon">⚡</span>
          <div class="event-body">
            ${ev.kind === 'ci_flip' ? `<div><strong>CI ${ev.to}</strong> on ${ev.ticket}</div><div style="color: var(--text-dim); font-size: 11.5px; margin-top: 2px;">build went ${ev.from} → ${ev.to}</div>` : ''}
            ${ev.kind === 'review_comment' ? `<div><strong>${ev.author}</strong> commented on ${ev.ticket}</div><div style="color: var(--text-dim); font-size: 11.5px; margin-top: 2px; font-style: italic">"${ev.body.slice(0, 90)}${ev.body.length > 90 ? '…' : ''}"</div>` : ''}
          </div>
          <div class="event-ago">${ev.ago}</div>
        </div>
      `).join('');
      wrap.innerHTML = banners + `<div class="hint-row">Concept B: event-driven. Quiet when nothing happens.</div>`;
    }
  }
}

function renderRoutine(icon, name, r) {
  if (r.state === 'idle') {
    return `
      <div class="routine idle">
        <div class="icon">${icon}</div>
        <div class="info">
          <div class="name">${name}</div>
          <div class="status">idle ${r.note ? '· ' + r.note : ''}</div>
        </div>
        <div class="pulse"></div>
      </div>`;
  }
  if (r.state === 'active') {
    return `
      <div class="routine">
        <div class="icon">${icon}</div>
        <div class="info">
          <div class="name">${name}</div>
          <div class="status ok">active${r.note ? ' · ' + r.note : ''}</div>
        </div>
        <div class="pulse"></div>
      </div>`;
  }
  // polling routine
  const status = r.status === 'warn'
    ? `<span class="warn">${r.note || 'overdue'}</span>`
    : `last ${r.last_poll_seconds_ago}s ago · next in ${Math.max(0, r.next_in)}s`;
  return `
    <div class="routine">
      <div class="icon">${icon}</div>
      <div class="info">
        <div class="name">${name}${r.watching_count !== undefined ? ` · watching ${r.watching_count}` : ''}</div>
        <div class="status ${r.status === 'warn' ? 'warn' : ''}">${status}</div>
      </div>
      <div class="pulse"></div>
    </div>`;
}

// ─── Kanban ───────────────────────────────────────────────────────
function renderKanban() {
  const hand = HANDS[current];
  const all = hand.tickets.concat(hand.adhoc || []);

  const byStage = {};
  STAGES.forEach(s => byStage[s.key] = []);
  all.forEach(t => { if (byStage[t.stage]) byStage[t.stage].push(t); });

  const kanban = document.getElementById("kanban");
  kanban.innerHTML = STAGES.map(s => {
    const items = byStage[s.key];
    const attentionCount = items.filter(t => t.attention).length;
    return `
      <div class="col ${s.terminal ? 'terminal' : ''} ${attentionCount > 0 ? 'attention' : ''}">
        <div class="col-header">
          <div class="col-title">${s.label}</div>
          <div class="col-counts">
            ${attentionCount > 0 ? `<span class="col-attention">${attentionCount}⚠</span>` : ''}
            <span class="col-count">${items.length}</span>
          </div>
        </div>
        <div class="col-body">
          ${items.length === 0
            ? `<div class="empty-col">—</div>`
            : items.map(t => renderCard(t)).join('')}
        </div>
      </div>`;
  }).join('');
}

function renderCard(t) {
  const isSel = selectedCard === t.key;
  const adhocCls = t.adhoc ? 'adhoc' : '';
  return `
    <div class="card ${t.attention ? 'attention' : ''} ${isSel ? 'selected' : ''}" onclick="openPanel('${t.key}')">
      <div class="card-key ${adhocCls}">
        <span>${t.key}</span>
        ${t.attention ? '<span class="attention-glyph">⚠</span>' : ''}
      </div>
      <div class="card-summary">${t.summary}</div>
      <div class="card-hint">${t.hint || ''}</div>
    </div>`;
}

// ─── Side panel: decision packet ──────────────────────────────────
function openPanel(key) {
  const hand = HANDS[current];
  const all = hand.tickets.concat(hand.adhoc || []);
  const t = all.find(x => x.key === key);
  if (!t) return;

  selectedCard = key;
  renderKanban();

  document.getElementById("panelKey").textContent = t.key;
  document.getElementById("panelSummary").textContent = t.summary;
  document.getElementById("panelBody").innerHTML = renderPanel(t);
  document.getElementById("sidePanel").classList.add("open");
}

function closePanel() {
  document.getElementById("sidePanel").classList.remove("open");
  selectedCard = null;
  renderKanban();
}

function renderPanel(t) {
  const goal = `
    <div class="section goal">
      <div class="section-label"><span class="section-num">1</span> GOAL</div>
      <div class="section-content">${t.goal || '(no goal recorded — pulled from ticket title)'}</div>
    </div>`;

  let done = '';
  if (t.done && t.done.length > 0) {
    done = `
      <div class="section done">
        <div class="section-label"><span class="section-num">2</span> DONE</div>
        <div class="section-content">
          <ul class="done-list">
            ${t.done.map((d, i) => `<li><span class="check">✓</span><span class="text ${i >= t.done.length - 2 ? 'recent' : ''}">${d}</span></li>`).join('')}
          </ul>
        </div>
      </div>`;
  }

  let now = '';
  if (t.now) {
    now = `
      <div class="section now">
        <div class="section-label"><span class="section-num">2</span> NOW</div>
        <div class="section-content">
          <div class="now-block">
            <div class="now-line">${t.now.line}</div>
            <div class="now-meta">${t.now.meta}</div>
          </div>
        </div>
      </div>`;
  }

  // 3rd section: DECIDE if attention; WATCHING FOR otherwise
  let third = '';
  if (t.attention) {
    third = renderDecide(t);
  } else if (t.next_checkpoint || t.next_eta_seconds !== undefined) {
    third = renderWatching(t);
  }

  return `${goal}${done}${now}${third}`;
}

function renderDecide(t) {
  let prompt = '';
  let body = '';

  if (t.checkpoint === 'pre_push') {
    prompt = `<strong>pre_push approval needed.</strong> The agent has finished implementation and verified locally. Acceptance is green. Operator should review the diff.`;
    body += `
      ${t.deploy_rec ? `<div class="recommendation ${t.deploy_rec === 'no-deploy' ? 'no-deploy' : ''}">
        <span class="rec-label">${t.deploy_rec === 'deploy' ? '↓ DEPLOY recommended' : t.deploy_rec === 'no-deploy' ? '○ NO DEPLOY needed' : '? NEEDS REVIEW'}</span>
        ${t.deploy_reason}
      </div>` : ''}
      ${t.diff ? `<div class="diff-list">
        ${t.diff.map(f => `<div class="file"><span>${f.file}</span><span><span class="ins">+${f.ins}</span> <span class="del">-${f.del}</span></span></div>`).join('')}
      </div>` : ''}
      <div class="actions">
        ${t.deploy_rec === 'deploy'
          ? `<button class="btn btn-primary">Approve + Deploy</button>`
          : `<button class="btn btn-primary">Approve, skip deploy</button>`}
        <button class="btn btn-danger">Reject</button>
        <button class="btn btn-takeover">⤵ Drop into chat</button>
      </div>`;
  } else if (t.checkpoint === 'plan_ready') {
    prompt = `<strong>plan_ready approval needed.</strong> The agent has produced a plan + acceptance contract. Operator should review the plan before any code is written.`;
    body += `
      ${t.plan_preview ? `<div class="diff-list">
        ${t.plan_preview.map((p, i) => `<div class="file"><span>${i + 1}. ${p}</span><span></span></div>`).join('')}
      </div>` : ''}
      ${t.deploy_rec ? `<div class="recommendation ${t.deploy_rec === 'no-deploy' ? 'no-deploy' : ''}">
        <span class="rec-label">${t.deploy_rec === 'deploy' ? '↓ DEPLOY recommended (at pre_push)' : '○ NO DEPLOY (at pre_push)'}</span>
        ${t.deploy_reason}
      </div>` : ''}
      <div class="actions">
        <button class="btn btn-primary">Approve plan</button>
        <button class="btn">View full proposal</button>
        <button class="btn btn-danger">Reject</button>
        <button class="btn btn-takeover">⤵ Drop into chat</button>
      </div>`;
  } else if (t.decide_kind === 'respond_to_review') {
    prompt = `<strong>Review activity needs your call.</strong> The agent can auto-triage and respond, or you can take over the strategy.`;
    body += `
      ${t.comments_preview ? `<div class="diff-list">
        ${t.comments_preview.map(c => `<div class="file"><span><strong style="color:var(--accent)">${c.author}:</strong> ${c.body}</span><span></span></div>`).join('')}
      </div>` : ''}
      ${t.ci === 'failed' ? `<div class="recommendation" style="border-color: var(--bad); color: var(--bad); background: var(--bad-soft);">
        <span class="rec-label" style="color: var(--bad)">⚠ CI also failing</span>
        Build went red 30s ago — likely related to the comment fix that just pushed.
      </div>` : ''}
      <div class="actions">
        <button class="btn btn-primary">Auto-respond (agent triages + replies)</button>
        <button class="btn">Take over manually</button>
        <button class="btn btn-takeover">⤵ Drop into chat</button>
      </div>`;
  }

  return `
    <div class="section decide">
      <div class="section-label"><span class="section-num">3</span> DECIDE</div>
      <div class="section-content">
        <div class="decide-prompt">${prompt}</div>
        ${body}
      </div>
    </div>`;
}

function renderWatching(t) {
  const pct = t.next_progress_pct || 0;
  const etaSec = t.next_eta_seconds;
  const etaStr = etaSec === null
    ? '—'
    : etaSec >= 60 ? `~${Math.round(etaSec/60)}m` : `~${etaSec}s`;

  return `
    <div class="section watching">
      <div class="section-label"><span class="section-num">3</span> WATCHING FOR</div>
      <div class="section-content">
        <div class="watching-content">
          <div class="next-check">
            Next checkpoint: <strong>${t.next_checkpoint || 'pending'}</strong>
            ${t.next_progress_pct !== undefined ? `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>` : ''}
            ${t.next_eta_seconds !== undefined ? `<div class="eta">est. ${etaStr} away · operator action: none right now</div>` : ''}
          </div>
        </div>
        <div style="margin-top: 12px; display: flex; gap: 8px;">
          <button class="btn btn-takeover">⤵ Drop into chat (still ok during in-flight)</button>
        </div>
      </div>
    </div>`;
}

// ─── Boot ─────────────────────────────────────────────────────────
function render() {
  renderTabs();
  renderRoutines();
  renderKanban();
}
function tick() {
  const el = document.getElementById("clock");
  if (el) el.textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}
render(); tick(); setInterval(tick, 30_000);

// Click outside to close panel
document.addEventListener('click', (e) => {
  const panel = document.getElementById('sidePanel');
  if (!panel.classList.contains('open')) return;
  if (panel.contains(e.target)) return;
  if (e.target.closest('.card')) return;
  closePanel();
});
</script>
