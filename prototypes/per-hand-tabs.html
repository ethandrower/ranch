<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ranch — Per-hand kanban + decision packet prototype</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161922;
    --panel-2: #1c2030;
    --panel-3: #232838;
    --border: #262b3c;
    --border-2: #313753;
    --text: #e6e9ef;
    --text-dim: #8a93a6;
    --text-faint: #5a6378;
    --accent: #6aa2ff;
    --warn: #f5a623;
    --warn-soft: #3a2e1e;
    --ok: #4eb960;
    --ok-soft: #1e3a2e;
    --bad: #d85a5a;
    --bad-soft: #3a1e1e;
    --magenta: #b85cb8;
    --cyan: #5cd0d0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }
  /* ─── Top bar ─── */
  .topbar {
    display: flex; align-items: stretch;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    user-select: none;
    height: 44px;
  }
  .brand {
    padding: 0 18px;
    display: flex; align-items: center;
    font-weight: 600; font-size: 14px;
    color: var(--text);
    letter-spacing: -0.01em;
    border-right: 1px solid var(--border);
  }
  .brand .brand-dot {
    display: inline-block;
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    margin-right: 8px;
    box-shadow: 0 0 8px var(--accent);
  }
  .tabs { display: flex; align-items: stretch; flex: 1; }
  .tab {
    padding: 0 16px;
    display: flex; align-items: center; gap: 8px;
    color: var(--text-dim);
    cursor: pointer;
    border-right: 1px solid var(--border);
    font-size: 13px;
  }
  .tab:hover { background: var(--panel-2); color: var(--text); }
  .tab.active {
    background: var(--bg);
    color: var(--text);
    box-shadow: inset 0 -2px 0 var(--accent);
  }
  .tab .badge {
    background: var(--warn);
    color: #1c1306;
    font-size: 10.5px; font-weight: 700;
    padding: 1px 6px; border-radius: 999px;
    min-width: 18px; text-align: center;
    line-height: 14px;
  }
  .tab .badge.zero {
    background: transparent;
    color: var(--text-faint);
    border: 1px solid var(--border-2);
    font-weight: 500;
  }
  .tab .hand-status {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ok);
  }
  .tab .hand-status.idle { background: var(--text-faint); }
  .topbar-right {
    padding: 0 16px;
    display: flex; align-items: center; gap: 14px;
    color: var(--text-dim);
    font-size: 12px;
    position: relative;
  }
  .topbar-right .meta { color: var(--text-faint); }

  /* ─── Activity popout button + dropdown ─── */
  .activity-trigger {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 10px 4px 8px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    font-family: inherit;
  }
  .activity-trigger:hover { background: var(--panel-2); color: var(--text); border-color: var(--border-2); }
  .activity-trigger.has-unseen { border-color: var(--warn); color: var(--warn); }
  .activity-trigger .glyph {
    display: inline-block;
    transition: transform 0.3s;
  }
  .activity-trigger.spinning .glyph { animation: rotate 2s linear infinite; }
  @keyframes rotate { to { transform: rotate(360deg); } }
  .activity-trigger .count {
    background: var(--warn);
    color: #1c1306;
    font-size: 10px; font-weight: 700;
    padding: 1px 5px;
    border-radius: 999px;
    line-height: 13px;
  }

  .activity-popout {
    position: absolute;
    top: 100%;
    right: 16px;
    margin-top: 6px;
    width: 360px;
    background: var(--panel);
    border: 1px solid var(--border-2);
    border-radius: 6px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    z-index: 100;
    display: none;
  }
  .activity-popout.open { display: block; }
  .ap-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
  .ap-section { padding: 10px 14px; }
  .ap-section + .ap-section { border-top: 1px solid var(--border); }
  .ap-section-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    margin-bottom: 8px;
    font-weight: 700;
  }
  .ap-status-row {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 0;
    font-size: 12px;
  }
  .ap-status-row .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ok);
  }
  .ap-status-row .dot.idle { background: var(--text-faint); }
  .ap-status-row .dot.warn { background: var(--warn); }
  .ap-status-row .rname { flex: 1; color: var(--text); }
  .ap-status-row .rstatus {
    color: var(--text-dim);
    font-family: "SF Mono", monospace;
    font-size: 11px;
  }
  .ap-status-row .rstatus.warn { color: var(--warn); }

  .ap-event {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    gap: 8px;
    padding: 7px 0;
    font-size: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .ap-event:last-child { border-bottom: none; }
  .ap-event .ev-icon {
    color: var(--warn);
    font-size: 12.5px;
  }
  .ap-event .ev-icon.ok { color: var(--ok); }
  .ap-event .ev-icon.bad { color: var(--bad); }
  .ap-event .ev-icon.dim { color: var(--text-faint); }
  .ap-event .ev-body {
    color: var(--text);
    font-size: 12px;
    line-height: 1.35;
  }
  .ap-event .ev-body .ev-detail {
    color: var(--text-dim);
    font-size: 11px;
    margin-top: 2px;
  }
  .ap-event .ev-ago {
    color: var(--text-faint);
    font-size: 11px;
    font-family: "SF Mono", monospace;
    white-space: nowrap;
  }
  .ap-empty {
    color: var(--text-faint);
    font-size: 12px;
    padding: 6px 0;
    font-style: italic;
  }

  /* ─── Routines comparison strip (shows BOTH concepts) ─── */
  .routines-bar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 18px 12px;
  }
  .routines-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .routines-header .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-faint);
    font-weight: 600;
  }
  .routines-toggle { display: flex; gap: 2px; }
  .routines-toggle button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 4px 12px;
    font-size: 11.5px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .routines-toggle button:first-child { border-radius: 4px 0 0 4px; }
  .routines-toggle button:last-child { border-radius: 0 4px 4px 0; }
  .routines-toggle button.active {
    background: var(--accent);
    color: #0a0f1c;
    border-color: var(--accent);
    font-weight: 600;
  }

  /* Routines: STRIP CONCEPT */
  .routines-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .routine {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 8px 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .routine .icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--panel-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .routine .info { flex: 1; }
  .routine .name {
    font-size: 11.5px;
    color: var(--text);
    font-weight: 500;
  }
  .routine .status {
    font-size: 10.5px;
    color: var(--text-dim);
    font-family: "SF Mono", monospace;
    margin-top: 1px;
  }
  .routine .status.ok { color: var(--ok); }
  .routine .status.warn { color: var(--warn); }
  .routine .pulse {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ok);
    animation: pulse 2s ease-out infinite;
  }
  .routine.idle .pulse { background: var(--text-faint); animation: none; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(78, 185, 96, 0.5); }
    70% { box-shadow: 0 0 0 6px rgba(78, 185, 96, 0); }
    100% { box-shadow: 0 0 0 0 rgba(78, 185, 96, 0); }
  }

  /* Routines: EVENT CONCEPT */
  .routines-event {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 16px;
    text-align: center;
    color: var(--text-faint);
    font-size: 12px;
    min-height: 56px;
    display: flex; align-items: center; justify-content: center;
  }
  .routines-event.has-event {
    background: var(--warn-soft);
    border-color: var(--warn);
    color: var(--text);
    text-align: left;
    justify-content: flex-start;
    gap: 12px;
  }
  .routines-event .event-icon {
    color: var(--warn);
    font-size: 18px;
  }
  .routines-event .event-body strong { color: var(--warn); }
  .routines-event .event-ago {
    color: var(--text-faint);
    font-size: 11px;
    margin-left: auto;
  }
  .routines-event .pretend {
    font-style: italic;
    color: var(--text-faint);
    font-size: 11.5px;
    margin-top: 4px;
  }

  .hint-row {
    color: var(--text-faint);
    font-size: 11px;
    margin-top: 8px;
    font-style: italic;
  }

  /* ─── Kanban ─── */
  /* ─── Initiative filter row ─── */
  .scope-bar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px 11px;
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
  }
  .scope-bar .scope-label {
    color: var(--text-faint);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    margin-right: 2px;
  }
  .scope-pill {
    position: relative;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.12s;
    overflow: hidden;  /* clip the progress fill */
  }
  /* Pill progress — a soft fill from left → right indicating fraction of
     tickets that have reached the "merge" terminal stage. Sits BEHIND the
     pill content via z-index. */
  .scope-pill .pill-progress {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: linear-gradient(90deg, rgba(126, 217, 178, 0.18), rgba(126, 217, 178, 0.10));
    border-right: 1px solid rgba(126, 217, 178, 0.35);
    z-index: 0;
    pointer-events: none;
    transition: width 0.25s ease;
  }
  .scope-pill > span { position: relative; z-index: 1; }
  .scope-pill.active .pill-progress {
    background: linear-gradient(90deg, rgba(10,15,28,0.22), rgba(10,15,28,0.10));
    border-right-color: rgba(10,15,28,0.30);
  }
  .scope-pill .pill-frac {
    color: var(--text-faint);
    font-size: 10px;
    font-weight: 600;
    font-family: "SF Mono", monospace;
  }
  .scope-pill.active .pill-frac { color: rgba(10,15,28,0.75); }
  .scope-pill:hover { background: var(--panel-2); color: var(--text); border-color: var(--border-2); }
  .scope-pill.active {
    background: var(--accent);
    color: #0a0f1c;
    border-color: var(--accent);
    font-weight: 600;
  }
  .scope-pill .pill-count {
    background: rgba(0,0,0,0.20);
    padding: 0 6px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 600;
    line-height: 16px;
  }
  .scope-pill.active .pill-count {
    background: rgba(0,0,0,0.25);
  }
  .scope-pill.active .pill-warn {
    background: var(--warn);
    color: #1c1306;
  }
  .scope-pill .pill-warn {
    background: var(--warn);
    color: #1c1306;
    padding: 0 6px;
    border-radius: 999px;
    font-size: 10px;
    font-weight: 700;
    line-height: 16px;
  }

  /* Drill-down breadcrumb */
  .breadcrumb {
    margin-left: auto;
    display: flex; align-items: center; gap: 8px;
    font-size: 11.5px;
    color: var(--text-dim);
  }
  .breadcrumb .crumb {
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 3px 9px;
    border-radius: 4px;
  }
  .breadcrumb .sep { color: var(--text-faint); }
  .breadcrumb .clear {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    margin-left: 6px;
  }
  .breadcrumb .clear:hover { background: var(--panel-2); color: var(--text); }

  /* Epic chip on cards */
  .epic-chip {
    background: var(--panel-3);
    color: var(--text-dim);
    font-family: "SF Mono", monospace;
    font-size: 9.5px;
    padding: 1px 5px;
    border-radius: 2px;
    margin-left: 6px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .epic-chip:hover {
    border-color: var(--border-2);
    color: var(--text);
  }
  /* Blocked card — desaturated with a dashed border so blocked work is
     visually distinct without disappearing. The ⛔ chip links to the blocker. */
  .card.blocked {
    opacity: 0.65;
    border-style: dashed;
    background: var(--panel);
  }
  .card.blocked .card-summary { color: var(--text-dim); }
  .blocked-chip {
    background: rgba(255,107,107,0.10);
    color: var(--bad);
    border: 1px solid rgba(255,107,107,0.30);
    font-family: "SF Mono", monospace;
    font-size: 9.5px;
    padding: 1px 6px;
    border-radius: 2px;
    margin-left: 6px;
    cursor: pointer;
  }
  .blocked-chip:hover { background: rgba(255,107,107,0.18); color: var(--text); }
  /* "⛔ N blocked" counter in the scope-bar */
  .scope-blocked {
    color: var(--bad);
    font-size: 11px;
    font-weight: 600;
    margin-left: 4px;
    background: rgba(255,107,107,0.10);
    border: 1px solid rgba(255,107,107,0.30);
    padding: 3px 8px;
    border-radius: 4px;
  }

  .kanban-wrap {
    overflow-x: auto;
    padding: 14px 16px 28px;
    height: calc(100vh - 44px - 50px);  /* topbar + scope bar */
  }
  .kanban {
    display: grid;
    grid-template-columns: repeat(10, minmax(150px, 1fr));
    gap: 10px;
    min-width: 1500px;
    align-items: flex-start;
  }
  .col {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    display: flex; flex-direction: column;
    min-height: 100px;
  }
  .col-header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--panel-2);
    border-radius: 6px 6px 0 0;
  }
  .col-title {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    font-weight: 600;
  }
  .col-counts { display: flex; gap: 6px; align-items: center; }
  .col-count {
    background: var(--panel-3);
    color: var(--text-dim);
    font-size: 10.5px;
    padding: 1px 6px;
    border-radius: 3px;
  }
  .col-attention {
    background: var(--warn);
    color: #1c1306;
    font-size: 10.5px; font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
  }
  .col-body {
    padding: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .col.terminal {
    background: rgba(78,185,96,0.05);
    border-color: rgba(78,185,96,0.3);
  }
  .col.terminal .col-title { color: var(--ok); }
  .col.attention {
    box-shadow: 0 0 0 1px var(--warn);
  }

  /* Cards */
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px 9px;
    cursor: pointer;
    transition: border-color 0.12s, transform 0.08s;
    position: relative;
  }
  .card:hover { border-color: var(--border-2); transform: translateY(-1px); }
  .card.attention {
    border-left: 3px solid var(--warn);
    padding-left: 8px;
  }
  .card.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  .card-key {
    font-family: "SF Mono", Menlo, monospace;
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
  .card-key.adhoc { color: var(--magenta); }
  .card-summary {
    color: var(--text);
    font-size: 12px;
    margin-top: 3px;
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .card-hint {
    color: var(--text-faint);
    font-size: 10.5px;
    margin-top: 4px;
    font-family: "SF Mono", monospace;
  }
  .card .attention-glyph {
    color: var(--warn);
    font-size: 12px;
  }
  .empty-col {
    color: var(--text-faint);
    text-align: center;
    padding: 18px 8px;
    font-size: 11px;
    border: 1px dashed var(--border);
    border-radius: 4px;
    margin: 6px;
  }

  /* ─── Side panel (decision packet) ─── */
  .side-panel {
    position: fixed;
    top: 44px; right: 0; bottom: 0;
    width: 540px;
    max-width: 50vw;
    background: var(--panel);
    border-left: 1px solid var(--border-2);
    box-shadow: -8px 0 24px rgba(0,0,0,0.4);
    transform: translateX(100%);
    transition: transform 0.25s ease, width 0.22s ease, max-width 0.22s ease;
    overflow-y: auto;
    display: flex; flex-direction: column;
  }
  .side-panel.open { transform: translateX(0); }
  /* Wide mode — engaged when an expandable plan/stage entry is opened so
     the reading content (multi-paragraph details) has room without forcing
     in-panel scroll. Toggle on .side-panel; the body responds via flex. */
  .side-panel.wide {
    width: 1080px;
    max-width: 90vw;
  }
  /* When expanded, push panel-body left to make room for the absolutely
     positioned expand-pane on the right. */
  .panel-body.has-expand { padding-right: 520px; }
  .expand-pane {
    position: absolute;
    top: 50px;  /* below .panel-header */
    right: 0; bottom: 0;
    width: 500px;
    border-left: 1px solid var(--border);
    background: var(--panel-2);
    padding: 18px 22px 32px;
    overflow-y: auto;
    box-sizing: border-box;
  }
  .expand-pane .ep-header {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-faint);
    font-weight: 700;
    margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .expand-pane .ep-close {
    background: transparent; border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 2px 8px; border-radius: 4px;
    font-size: 11px; cursor: pointer;
  }
  .expand-pane .ep-close:hover { background: var(--panel-3); color: var(--text); }
  .expand-pane .ep-title {
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .expand-pane .ep-body {
    color: var(--text-dim);
    font-size: 12.5px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  /* Expandable list items in the side panel — done-list items become
     clickable affordances; clicking opens the expand-pane. */
  .done-list li.expandable {
    cursor: pointer;
    border-radius: 3px;
    padding: 2px 4px;
    margin: 0 -4px;
  }
  .done-list li.expandable:hover { background: var(--panel-2); }
  .done-list li.expandable.active { background: var(--panel-3); }
  .done-list li.expandable .text::after {
    content: " ▸";
    color: var(--text-faint);
    font-size: 10px;
  }
  .done-list li.expandable.active .text::after { content: " ▾"; }
  .panel-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: var(--panel-2);
  }
  .panel-header .key {
    font-family: "SF Mono", monospace;
    color: var(--accent);
    font-weight: 600;
    font-size: 13px;
    margin-right: 8px;
  }

      jira_triage:  {last_poll_seconds_ago: 4, next_in: 26, status: "ok", note: "0 viable candidates last poll"},
      pr_comments:  {last_poll_seconds_ago: 110, next_in: 10, status: "ok", watching_count: 1},
      ci_status:    {last_poll_seconds_ago: 59, next_in: 1, status: "ok", watching_count: 1},
      self_review:  {state: "idle"},
    },
    events: [],
    events_log: [
      {icon: "⟳", severity: "info", title: "Jira poll · 0 viable candidates", detail: "queue stable; sleeping until next poll", ago: "4s"},
      {icon: "🟰", severity: "info", title: "PR #1580 idle 2 days",            detail: "no review activity; nothing to do",      ago: "2d"},
    ],
    tickets: [
      {
        key: "ECD-1410", initiative: "scrapers", epic: "ECD-1400", stage: "review",
        summary: "PubMed callback signing v2",
        hint: "2d · no activity",
        attention: false,
        pr_id: 1580, ci: "passed",
        goal: "v2 signing scheme — HMAC instead of static token.",
        done: ["Implementation", "Acceptance 5/5 green", "PR opened"],
        now: {
          line: "PR open for 2 days with no review activity. Branch is up to date with develop.",
          meta: "PR #1580 · 8 files changed",
        },
        next_checkpoint: "reviewer activity",
        next_eta_seconds: null,
      },
    ],
    adhoc: [],
  },
};

let current = "max";
let selectedCard = null;
let activityOpen = false;
// Initiative scoping — board shows one initiative at a time, switched via
// pills. drilledEpic narrows further to a single epic within the current
// initiative (set by clicking an epic chip on a card).
let currentInitiative = {max: "ref-mgmt", jeffy: "ref-mgmt", arnold: "scrapers", kesha: "scrapers"};
let drilledEpic = {max: null, jeffy: null, arnold: null, kesha: null};
let expandedStep = null;  // {ticketKey, index} — drives wide-mode + expand-pane
// In a real impl this would be persisted per-operator across sessions; for the
// prototype we just track unseen events since the popout was last opened.
let activitySeenAt = {max: 0, jeffy: 0, arnold: 0, kesha: 0};

// Per-step details — keyed by `${ticketKey}::${index}` — surfaced in the
// expand pane when a done-list step is clicked. Skipped steps fall back to
// a generic "(no extra notes for this step)" message.
const STEP_DETAILS = {
  // max — ECD-2087 (pre_push, parked for operator deploy decision)

  "ECD-2087::3": "Acceptance contract: 4 checks. pytest tests/test_dedup_dispatch.py (3 cases — dispatch fires, dispatch skipped on empty batch, dispatch retried on transient error), plus a scraper integration check against the local fake-scrape fixture. All 4 green in 22s.\n\nThe scraper integration check is the reason `deploy` is recommended — it can't be run locally against the real scraper fleet, and staging is the only place to validate end-to-end.",

  "ECD-1410::2": "PR #1620 opened against develop. CI passed in ~6min. Then mohamed pushed back on the approach 6m ago — he believes the fingerprint key is wrong and a cached parse should suffice. Awaiting strategy call.",

// ─── Tabs ─────────────────────────────────────────────────────────
function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  Object.entries(HANDS).forEach(([k, h]) => {
    const all = h.tickets.concat(h.adhoc || []);
    const needsYouCount = all.filter(t => t.attention).length;
    const tab = document.createElement("div");
    tab.className = "tab" + (k === current ? " active" : "");
    tab.innerHTML = `
      <span class="hand-status ${h.status === 'idle' ? 'idle' : ''}"></span>
      <span class="hand-name">${h.label}</span>
      <span class="badge ${needsYouCount === 0 ? 'zero' : ''}">${needsYouCount === 0 ? '0' : needsYouCount}</span>
    `;
    tab.onclick = () => {
      current = k; closePanel();
      // Switching hands resets initiative drill-down to the hand's default.
      drilledEpic[current] = null;
      render();
    };
    el.appendChild(tab);
  });
}

// ─── Scope bar (initiative pills + epic breadcrumb) ───────────────
function renderScopeBar() {
  const bar = document.getElementById("scopeBar");
  const hand = HANDS[current];
  const all = hand.tickets.concat(hand.adhoc || []);

  // Counts, attention, blocked, and progress per initiative key.
  // Progress = merged / total. (Could also count "review" + "pr_open" as
  // near-done — left as merged-only for now to keep the signal crisp.)
  const stats = {};
  (hand.initiatives || []).forEach(k => stats[k] = {count: 0, attention: 0, blocked: 0, merged: 0});
  all.forEach(t => {
    const k = t.initiative || "misc";
    if (!stats[k]) stats[k] = {count: 0, attention: 0, blocked: 0, merged: 0};
    stats[k].count += 1;
    if (t.attention) stats[k].attention += 1;
    if (t.blocked_by) stats[k].blocked += 1;
    if (t.stage === "merge") stats[k].merged += 1;
  });

  const initiativesOrder = hand.initiatives || Object.keys(stats);
  const cur = currentInitiative[current];

  const pills = initiativesOrder.map(k => {
    const s = stats[k] || {count: 0, attention: 0, blocked: 0, merged: 0};
    const active = k === cur ? "active" : "";
    const pct = s.count === 0 ? 0 : Math.round((s.merged / s.count) * 100);
    return `
      <button class="scope-pill ${active}" onclick="setInitiative('${k}')" title="${s.merged}/${s.count} merged · ${s.attention} need attention${s.blocked ? ' · ' + s.blocked + ' blocked' : ''}">
        <span class="pill-progress" style="width: ${pct}%"></span>
        <span>${INITIATIVES[k] || k}</span>
        <span class="pill-count">${s.count}</span>
        <span class="pill-frac">${s.merged}/${s.count}</span>
        ${s.attention > 0 ? `<span class="pill-warn">${s.attention}⚠</span>` : ''}
      </button>`;
  }).join("");

  // Cross-initiative blocked count — surfaces cascading-risk at a glance.
  const totalBlocked = Object.values(stats).reduce((a, s) => a + s.blocked, 0);
  const blockedBadge = totalBlocked > 0
    ? `<span class="scope-blocked" title="Tickets blocked by another ticket's decision">⛔ ${totalBlocked} blocked</span>`
    : "";

  const epic = drilledEpic[current];
  const crumb = epic ? `
    <div class="breadcrumb">
      <span>drilled into</span>
      <span class="crumb">${epic}</span>
      <button class="clear" onclick="clearEpicDrill()">clear ✕</button>
    </div>` : "";

  bar.innerHTML = `<span class="scope-label">Initiative</span>${pills}${blockedBadge}${crumb}`;
}

function setInitiative(key) {
  currentInitiative[current] = key;
  drilledEpic[current] = null;
  closePanel();
  render();
}

function setEpicDrill(epic) {
  drilledEpic[current] = epic;
  closePanel();
  render();
}

function clearEpicDrill() {
  drilledEpic[current] = null;
  render();
}

// ─── Activity popout ──────────────────────────────────────────────
function toggleActivity(e) {
  if (e) e.stopPropagation();
  activityOpen = !activityOpen;
  document.getElementById("activityPopout").classList.toggle("open", activityOpen);
  if (activityOpen) {
    // Mark events seen
    activitySeenAt[current] = Date.now();
    renderActivityTrigger();
    renderActivityPopout();
  }
}

function renderActivityTrigger() {
  const hand = HANDS[current];
  const trigger = document.getElementById("activityTrigger");
  const countEl = document.getElementById("activityCount");
  // Count "unseen" events since last open. For the prototype we treat any
  // event with ago in seconds < some threshold as unseen if popout has not
  // been opened recently. Simpler model: count events newer than 5 minutes.
  const unseen = (hand.events || []).filter(e => {
    if (e.ago.endsWith('s')) return true;
    if (e.ago.endsWith('m')) return parseInt(e.ago) < 10;
    return false;
  }).length;
  if (unseen > 0 && !activityOpen) {
    countEl.textContent = unseen;
    countEl.style.display = "inline-block";
    trigger.classList.add("has-unseen");
  } else {
    countEl.style.display = "none";
    trigger.classList.remove("has-unseen");
  }
}

function renderActivityPopout() {
  if (!activityOpen) return;
  const hand = HANDS[current];
  document.getElementById("apHandName").textContent = current;
  document.getElementById("apClock").textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});

  const body = document.getElementById("apBody");

  // STATUS — what each routine is doing right now
  const statusRows = [
    {name: "Jira triage",  icon: "⟳", r: hand.routines.jira_triage},
    {name: "PR comments",  icon: "💬", r: hand.routines.pr_comments},
    {name: "CI status",    icon: "✓", r: hand.routines.ci_status},
    {name: "Self-review",  icon: "👁", r: hand.routines.self_review},
  ];

  const statusHtml = statusRows.map(({name, icon, r}) => {
    let statusText, dotCls = '';
    if (r.state === 'idle') {
      statusText = `<span style="color: var(--text-faint)">idle${r.note ? ' · ' + r.note : ''}</span>`;
      dotCls = 'idle';
    } else if (r.state === 'active') {
      statusText = `<span style="color: var(--ok)">active${r.note ? ' · ' + r.note : ''}</span>`;
    } else {
      // polling routine
      if (r.status === 'warn') {
        statusText = `<span class="warn">${r.note || 'overdue'}</span>`;
        dotCls = 'warn';
      } else {
        const watching = r.watching_count !== undefined ? ` · watching ${r.watching_count}` : '';
        statusText = `next in ${Math.max(0, r.next_in)}s${watching}`;
      }
    }
    return `
      <div class="ap-status-row">
        <span class="dot ${dotCls}"></span>
        <span class="rname">${icon} ${name}</span>
        <span class="rstatus ${r.status === 'warn' ? 'warn' : ''}">${statusText}</span>
      </div>`;
  }).join('');

  // RECENT EVENTS — newest first
  const events = hand.events_log || [];
  const eventsHtml = events.length === 0
    ? `<div class="ap-empty">No recent events.</div>`
    : events.map(e => {
        const iconCls = e.severity === 'good' ? 'ok' : e.severity === 'bad' ? 'bad' : e.severity === 'info' ? 'dim' : '';
        return `
          <div class="ap-event">
            <span class="ev-icon ${iconCls}">${e.icon}</span>
            <div class="ev-body">
              ${e.title}
              ${e.detail ? `<div class="ev-detail">${e.detail}</div>` : ''}
            </div>
            <span class="ev-ago">${e.ago}</span>
          </div>`;
      }).join('');

  body.innerHTML = `
    <div class="ap-section">
      <div class="ap-section-label">Routines · current state</div>
      ${statusHtml}
    </div>
    <div class="ap-section">
      <div class="ap-section-label">Recent activity</div>
      ${eventsHtml}
    </div>
  `;
}

// ─── Kanban ───────────────────────────────────────────────────────
function renderKanban() {
  const hand = HANDS[current];
  const all = hand.tickets.concat(hand.adhoc || []);

  // Filter by current initiative; further filter by drilled epic if set.
  // Tickets without an `initiative` fall into "misc".
  const initKey = currentInitiative[current];
  const epicKey = drilledEpic[current];
  const visible = all.filter(t => {
    const ti = t.initiative || "misc";
    if (ti !== initKey) return false;
    if (epicKey && t.epic !== epicKey) return false;
    return true;
  });

  const byStage = {};
  STAGES.forEach(s => byStage[s.key] = []);
  visible.forEach(t => { if (byStage[t.stage]) byStage[t.stage].push(t); });

  const kanban = document.getElementById("kanban");
  kanban.innerHTML = STAGES.map(s => {
    const items = byStage[s.key];
    const attentionCount = items.filter(t => t.attention).length;
    return `
      <div class="col ${s.terminal ? 'terminal' : ''} ${attentionCount > 0 ? 'attention' : ''}">
        <div class="col-header">
          <div class="col-title">${s.label}</div>
          <div class="col-counts">
            ${attentionCount > 0 ? `<span class="col-attention">${attentionCount}⚠</span>` : ''}
            <span class="col-count">${items.length}</span>
          </div>
        </div>
        <div class="col-body">
          ${items.length === 0
            ? `<div class="empty-col">—</div>`
            : items.map(t => renderCard(t)).join('')}
        </div>
      </div>`;
  }).join('');
}

function renderCard(t) {
  const isSel = selectedCard === t.key;
  const adhocCls = t.adhoc ? 'adhoc' : '';
  const epic = t.epic
    ? `<span class="epic-chip" title="Drill into ${t.epic}" onclick="event.stopPropagation(); setEpicDrill('${t.epic}')">${t.epic}</span>`
    : '';
  // Blocked-by chip — clicking it scrolls/navigates to the blocker by
  // opening its panel (no-op if the blocker isn't in current view, but
  // the chip still makes the dependency visible).
  const blocked = t.blocked_by
    ? `<span class="blocked-chip" title="Blocked by ${t.blocked_by} — ${t.blocked_reason || 'awaits its decision'}" onclick="event.stopPropagation(); openPanel('${t.blocked_by}')">⛔ ${t.blocked_by}</span>`
    : '';
  return `
    <div class="card ${t.attention ? 'attention' : ''} ${isSel ? 'selected' : ''} ${t.blocked_by ? 'blocked' : ''}" onclick="openPanel('${t.key}')">
      <div class="card-key ${adhocCls}">
        <span>${t.key}</span>
        ${epic}
        ${blocked}
        ${t.attention ? '<span class="attention-glyph">⚠</span>' : ''}
      </div>
      <div class="card-summary">${t.summary}</div>
      <div class="card-hint">${t.hint || ''}</div>
    </div>`;
}

// ─── Side panel: decision packet ──────────────────────────────────
function openPanel(key) {
  const hand = HANDS[current];
  const all = hand.tickets.concat(hand.adhoc || []);
  const t = all.find(x => x.key === key);
  if (!t) return;

  selectedCard = key;
  // Switching cards clears any expanded step (it belonged to the previous ticket).
  if (!expandedStep || expandedStep.ticketKey !== key) {
    expandedStep = null;
    document.getElementById("sidePanel").classList.remove("wide");
  }
  renderKanban();

  document.getElementById("panelKey").textContent = t.key;
  document.getElementById("panelSummary").textContent = t.summary;
  rebuildPanelBody(t);
  document.getElementById("sidePanel").classList.add("open");
}

function closePanel() {
  document.getElementById("sidePanel").classList.remove("open");
  document.getElementById("sidePanel").classList.remove("wide");
  selectedCard = null;
  expandedStep = null;
  renderKanban();
}

// Inner helper — re-renders only the panel body so we can toggle wide mode
// without re-rendering the whole board.
function rebuildPanelBody(t) {
  const body = document.getElementById("panelBody");
  const sections = renderPanel(t);
  const isExpanded = expandedStep && expandedStep.ticketKey === t.key;
  body.className = "panel-body" + (isExpanded ? " has-expand" : "");
  body.innerHTML = sections + (isExpanded ? renderExpandPane(t, expandedStep.index) : "");
}

function toggleStep(ticketKey, index) {
  const hand = HANDS[current];
  const all = hand.tickets.concat(hand.adhoc || []);
  const t = all.find(x => x.key === ticketKey);
  if (!t) return;

  const already = expandedStep && expandedStep.ticketKey === ticketKey && expandedStep.index === index;
  if (already) {
    expandedStep = null;
    document.getElementById("sidePanel").classList.remove("wide");
  } else {
    expandedStep = {ticketKey, index};
    document.getElementById("sidePanel").classList.add("wide");
  }
  rebuildPanelBody(t);
}

function renderExpandPane(t, index) {
  const stepLabel = (t.done && t.done[index]) || "(step)";
  const detailKey = `${t.key}::${index}`;
  const detail = STEP_DETAILS[detailKey];
  const bodyHtml = detail
    ? detail
    : `(no extra notes for this step yet — once the agent populates <code>record_state(details=...)</code> for non-trivial steps this is where the multi-paragraph narrative shows up: what was attempted, results, decisions, issues, conclusion)`;
  return `
    <div class="expand-pane">
      <div class="ep-header">
        <span>Step ${index + 1} · details</span>
        <button class="ep-close" onclick="toggleStep('${t.key}', ${index})">collapse ▸</button>
      </div>
      <div class="ep-title">${stepLabel}</div>
      <div class="ep-body">${bodyHtml}</div>
    </div>`;
}

function renderPanel(t) {
  const goal = `
    <div class="section goal">
      <div class="section-label"><span class="section-num">1</span> GOAL</div>
      <div class="section-content">${t.goal || '(no goal recorded — pulled from ticket title)'}</div>
    </div>`;

  let done = '';
  if (t.done && t.done.length > 0) {
    const activeIdx = (expandedStep && expandedStep.ticketKey === t.key) ? expandedStep.index : -1;
    done = `
      <div class="section done">
        <div class="section-label"><span class="section-num">2</span> DONE</div>
        <div class="section-content">
          <ul class="done-list">
            ${t.done.map((d, i) => `<li class="expandable ${i === activeIdx ? 'active' : ''}" onclick="toggleStep('${t.key}', ${i})"><span class="check">✓</span><span class="text ${i >= t.done.length - 2 ? 'recent' : ''}">${d}</span></li>`).join('')}
          </ul>
        </div>
      </div>`;
  }

  let now = '';
  if (t.now) {
    now = `
      <div class="section now">
        <div class="section-label"><span class="section-num">2</span> NOW</div>
        <div class="section-content">
          <div class="now-block">
            <div class="now-line">${t.now.line}</div>
            <div class="now-meta">${t.now.meta}</div>
          </div>
        </div>
      </div>`;
  }

  // 3rd section: DECIDE if attention; WATCHING FOR otherwise
  let third = '';
  if (t.attention) {
    third = renderDecide(t);
  } else if (t.next_checkpoint || t.next_eta_seconds !== undefined) {
    third = renderWatching(t);
  }

  return `${goal}${done}${now}${third}`;
}

function renderDecide(t) {
  let prompt = '';
  let body = '';

  if (t.checkpoint === 'pre_push') {
    prompt = `<strong>pre_push approval needed.</strong> The agent has finished implementation and verified locally. Acceptance is green. Operator should review the diff.`;
    body += `
      ${t.deploy_rec ? `<div class="recommendation ${t.deploy_rec === 'no-deploy' ? 'no-deploy' : ''}">
        <span class="rec-label">${t.deploy_rec === 'deploy' ? '↓ DEPLOY recommended' : t.deploy_rec === 'no-deploy' ? '○ NO DEPLOY needed' : '? NEEDS REVIEW'}</span>
        ${t.deploy_reason}
      </div>` : ''}
      ${t.diff ? `<div class="diff-list">
        ${t.diff.map(f => `<div class="file"><span>${f.file}</span><span><span class="ins">+${f.ins}</span> <span class="del">-${f.del}</span></span></div>`).join('')}
      </div>` : ''}
      <div class="actions">
        ${t.deploy_rec === 'deploy'
          ? `<button class="btn btn-primary">Approve + Deploy</button>`
          : `<button class="btn btn-primary">Approve, skip deploy</button>`}
        <button class="btn btn-danger">Reject</button>
        <button class="btn btn-takeover">⤵ Drop into chat</button>
      </div>`;
  } else if (t.checkpoint === 'plan_ready') {
    prompt = `<strong>plan_ready approval needed.</strong> The agent has produced a plan + acceptance contract. Operator should review the plan before any code is written.`;
    body += `
      ${t.plan_preview ? `<div class="diff-list">
        ${t.plan_preview.map((p, i) => `<div class="file"><span>${i + 1}. ${p}</span><span></span></div>`).join('')}
      </div>` : ''}
      ${t.deploy_rec ? `<div class="recommendation ${t.deploy_rec === 'no-deploy' ? 'no-deploy' : ''}">
        <span class="rec-label">${t.deploy_rec === 'deploy' ? '↓ DEPLOY recommended (at pre_push)' : '○ NO DEPLOY (at pre_push)'}</span>
        ${t.deploy_reason}
      </div>` : ''}
      <div class="actions">
        <button class="btn btn-primary">Approve plan</button>
        <button class="btn">View full proposal</button>
        <button class="btn btn-danger">Reject</button>
        <button class="btn btn-takeover">⤵ Drop into chat</button>
      </div>`;
  } else if (t.decide_kind === 'respond_to_review') {
    prompt = `<strong>Review activity needs your call.</strong> The agent can auto-triage and respond, or you can take over the strategy.`;
    body += `
      ${t.comments_preview ? `<div class="diff-list">
        ${t.comments_preview.map(c => `<div class="file"><span><strong style="color:var(--accent)">${c.author}:</strong> ${c.body}</span><span></span></div>`).join('')}
      </div>` : ''}
      ${t.ci === 'failed' ? `<div class="recommendation" style="border-color: var(--bad); color: var(--bad); background: var(--bad-soft);">
        <span class="rec-label" style="color: var(--bad)">⚠ CI also failing</span>
        Build went red 30s ago — likely related to the comment fix that just pushed.
      </div>` : ''}
      <div class="actions">
        <button class="btn btn-primary">Auto-respond (agent triages + replies)</button>
        <button class="btn">Take over manually</button>
        <button class="btn btn-takeover">⤵ Drop into chat</button>
      </div>`;
  }

  return `
    <div class="section decide">
      <div class="section-label"><span class="section-num">3</span> DECIDE</div>
      <div class="section-content">
        <div class="decide-prompt">${prompt}</div>
        ${body}
      </div>
    </div>`;
}

function renderWatching(t) {
  const pct = t.next_progress_pct || 0;
  const etaSec = t.next_eta_seconds;
  const etaStr = etaSec === null
    ? '—'
    : etaSec >= 60 ? `~${Math.round(etaSec/60)}m` : `~${etaSec}s`;

  return `
    <div class="section watching">
      <div class="section-label"><span class="section-num">3</span> WATCHING FOR</div>
      <div class="section-content">
        <div class="watching-content">
          <div class="next-check">
            Next checkpoint: <strong>${t.next_checkpoint || 'pending'}</strong>
            ${t.next_progress_pct !== undefined ? `<div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>` : ''}
            ${t.next_eta_seconds !== undefined ? `<div class="eta">est. ${etaStr} away · operator action: none right now</div>` : ''}
          </div>
        </div>
        <div style="margin-top: 12px; display: flex; gap: 8px;">
          <button class="btn btn-takeover">⤵ Drop into chat (still ok during in-flight)</button>
        </div>
      </div>
    </div>`;
}

// ─── Boot ─────────────────────────────────────────────────────────
function render() {
  renderTabs();
  renderScopeBar();
  renderKanban();
  renderActivityTrigger();
  if (activityOpen) renderActivityPopout();
}
function tick() {
  const el = document.getElementById("clock");
  if (el) el.textContent = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}
render(); tick(); setInterval(tick, 30_000);

// Click outside to close panel
document.addEventListener('click', (e) => {
  // Side panel
  const panel = document.getElementById('sidePanel');
  if (panel.classList.contains('open')
      && !panel.contains(e.target)
      && !e.target.closest('.card')
      && !e.target.closest('.scope-bar')
      && !e.target.closest('.epic-chip')) {
    closePanel();
  }
  // Activity popout
  if (activityOpen
      && !e.target.closest('#activityPopout')
      && !e.target.closest('#activityTrigger')) {
    activityOpen = false;
    document.getElementById('activityPopout').classList.remove('open');
  }
});
</script>
</body>
</html>
